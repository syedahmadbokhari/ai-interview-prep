name: Live AI Evaluation

on:
  workflow_dispatch:
    inputs:
      runs:
        description: "Repeated benchmark runs"
        required: true
        default: "1"
      limit:
        description: "Optional question limit for smoke tests"
        required: false
        default: ""
  schedule:
    - cron: "0 6 * * 1"

jobs:
  live-eval:
    name: Live Model Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check live credentials
        run: |
          python - <<'PY'
          import os, sys
          missing = [k for k in ("ANTHROPIC_API_KEY", "GROQ_API_KEY") if not os.environ.get(k)]
          if missing:
              print("Missing required GitHub secrets: " + ", ".join(missing))
              sys.exit(1)
          print("Required live evaluation secrets are present.")
          PY

      - name: Run live benchmark
        run: |
          LIMIT_ARG=""
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            LIMIT_ARG="--limit ${{ github.event.inputs.limit }}"
          fi
          python -m evals.runner --config all --mode live --runs "${{ github.event.inputs.runs || '1' }}" $LIMIT_ARG --output-dir evals/results/live_ci

      - name: Run live gate if baseline exists
        run: |
          if [ ! -f evals/baselines/live_v1.json ]; then
            echo "No approved live baseline is available. Run and approve an initial live benchmark before regression gating."
            exit 0
          fi
          python -m evals.quality_gate \
            --summary evals/results/live_ci/summary.json \
            --baseline evals/baselines/live_v1.json \
            --policy evals/policies/live_gate.json \
            --output-dir evals/results/live_ci

      - name: Write job summary
        if: always()
        run: |
          echo "## Live AI Evaluation" >> "$GITHUB_STEP_SUMMARY"
          if [ -f evals/results/live_ci/QUALITY_GATE.md ]; then
            cat evals/results/live_ci/QUALITY_GATE.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Live benchmark completed without a live baseline gate, or failed before gate generation." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload live evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-evaluation
          path: |
            evals/results/live_ci/results.json
            evals/results/live_ci/summary.json
            evals/results/live_ci/results.csv
            evals/results/live_ci/failures.jsonl
            evals/results/live_ci/comparative_failures.json
            evals/results/live_ci/REPORT.md
            evals/results/live_ci/quality_gate.json
            evals/results/live_ci/QUALITY_GATE.md
          retention-days: 30
